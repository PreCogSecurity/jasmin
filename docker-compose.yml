version: '3.8'

services:
  jasmin:
    build: .
    container_name: jasmin
    environment:
      - JASMIN_RABBITMQ_HOST=rabbitmq
      - JASMIN_RABBITMQ_PORT=5672
      - JASMIN_RABBITMQ_VHOST=/
      - JASMIN_RABBITMQ_USERNAME=guest
      - JASMIN_RABBITMQ_PASSWORD=guest
      - JASMIN_REDIS_HOST=redis
      - JASMIN_REDIS_PORT=6379
      - JASMIN_REDIS_USERNAME=guest
      - JASMIN_REDIS_PASSWORD=guest
      - JASMIN_MYSQL_HOST=mysql
      - JASMIN_MYSQL_USER=jasmin
      - JASMIN_MYSQL_PASSWORD=jasmin
      - JASMIN_MYSQL_DATABASE=jasmin
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "5672:5672"
      - "6379:6379"
      - "3306:3306"

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=jasmin
      - MYSQL_USER=jasmin
      - MYSQL_PASSWORD=your_mysql_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"